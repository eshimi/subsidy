name: Deploy to Cloudflare Workers

# jGrants の募集中データを毎朝取り込み直して Cloudflare Workers にデプロイする（日本時間 6:12）。
# push では動かさない（push のデプロイは Cloudflare 側の Git 連携が担当するため、二重にならない）。
# jGrants の取得と制度ページの生成は wrangler.jsonc の build.command（npm run build:grants）が、デプロイの直前に行う。
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN（Workers の編集権限）, CLOUDFLARE_ACCOUNT_ID
# 未設定の場合はデプロイをスキップする。
# デプロイのあとに、更新したページを IndexNow で検索エンジンに知らせる（scripts/indexnow.mjs。前回から変わったページだけを送る）。
on:
  schedule:
    - cron: '12 21 * * *'
  workflow_dispatch:

# 詳細データ（data/jgrants-details.json）をリポジトリに保存するため、書き込み権限が要る
permissions:
  contents: write

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 制度ごとの詳細は、持っていない制度・内容が変わった制度だけを取る（1回の上限は JGRANTS_DETAIL_BUDGET）。失敗しても、デプロイは続ける
      - name: jGrants の制度の詳細を更新（差分のみ）
        continue-on-error: true
        env:
          JGRANTS_DETAIL_BUDGET: '400'
        run: |
          node scripts/fetch-jgrants.mjs
          node scripts/update-jgrants-details.mjs
      # 更新した詳細データをリポジトリに保存する。Cloudflare の Git 連携のビルドは、これを読むだけにする。
      # [skip ci] でビルドの二重起動を避ける（このあとのデプロイが、更新したデータを使う）
      - name: 詳細データをリポジトリに保存
        continue-on-error: true
        run: |
          if git diff --quiet -- data/jgrants-details.json && [ -z "$(git ls-files --others --exclude-standard data/jgrants-details.json)" ]; then
            echo "詳細データに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jgrants-details.json
          git commit -m "jGrants の制度の詳細データを更新 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # 本番のブランチが2つに分かれているため、もう一方にも保存する（早送りできるときだけ）
          for b in claude/subsidy-finder-cloudflare-2oorwy claude/business-subsidy-finder-2v9gwr; do
            [ "$b" = "${GITHUB_REF_NAME}" ] && continue
            git push origin "HEAD:$b" || echo "::warning::$b には保存できませんでした（分岐している可能性があります）"
          done
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、デプロイをスキップしました"
            exit 0
          fi
          npx wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      # 前回知らせたページの記録（ページごとのハッシュ）。実行のたびに新しい記録で保存し直す
      - name: IndexNow の記録を復元
        if: steps.deploy.outputs.deployed == 'true'
        uses: actions/cache@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      # 失敗してもデプロイは成功のままにする（次の実行で、まだ送れていないページも送り直される）
      - name: IndexNow で更新を通知
        if: steps.deploy.outputs.deployed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs
