name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t subsidy-finder .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 subsidy-finder
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs app
          exit 1
