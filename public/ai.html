<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AI・キーワードで探す｜補助金ネット</title>
  <link rel="canonical" href="https://hojyokin.net/search.html">
  <meta http-equiv="refresh" content="0; url=search.html">
  <script>
    // 「AIに相談して探す」は search.html に統合しました。共有された検索条件（q, zip など）を引き継いで移動します。
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.has('q')) { p.set('desc', p.get('q')); p.delete('q'); }
      var qs = p.toString();
      location.replace('search.html' + (qs ? '?' + qs : '') + (qs ? '#ai-search' : ''));
    })();
  </script>
  <style>body { background: #fff; color: #1f2328; font-family: sans-serif; padding: 2rem 1rem; }</style>
</head>
<body>
  <p>このページは「<a href="search.html">AI・キーワードで探す</a>」に移動しました。</p>
</body>
</html>
