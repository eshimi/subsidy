<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380">
  <!-- Placeholder illustration for hero section -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F8C83;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8735A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="170" cy="190" r="140" fill="url(#grad1)" opacity="0.1"/>

  <!-- Main illustration elements -->
  <g transform="translate(170, 190)">
    <!-- Person silhouette -->
    <circle cx="0" cy="-60" r="25" fill="#2F8C83" opacity="0.8"/>
    <path d="M -30,-35 Q -30,-15 -15,5 L -5,40 M 30,-35 Q 30,-15 15,5 L 5,40 M -20,-20 L 20,-20"
          stroke="#2F8C83" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Growth arrow -->
    <g transform="translate(-60, -40)">
      <path d="M 0,40 L 0,10 M 0,10 L -8,18 M 0,10 L 8,18"
            stroke="#E8735A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>

    <!-- Success elements -->
    <circle cx="55" cy="-30" r="20" fill="#2F8C83" opacity="0.3"/>
    <path d="M 48,-32 L 53,-27 L 62,-38" stroke="#2F8C83" stroke-width="3" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Network nodes -->
    <circle cx="-45" cy="20" r="12" fill="#E8735A" opacity="0.4"/>
    <circle cx="45" cy="20" r="12" fill="#E8735A" opacity="0.4"/>
    <circle cx="0" cy="50" r="12" fill="#E8735A" opacity="0.4"/>

    <!-- Connection lines -->
    <line x1="-45" y1="20" x2="0" y2="50" stroke="#E8735A" stroke-width="2" opacity="0.2"/>
    <line x1="45" y1="20" x2="0" y2="50" stroke="#E8735A" stroke-width="2" opacity="0.2"/>
  </g>
</svg>
